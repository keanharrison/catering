<!doctype html>
<html lang="en" data-bs-theme="light" data-bs-navbar-position="vertical">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/branding/pearl-island-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Pearl Island2GO · Tabler shell preview</title>
    <script>
      // Apply the saved theme before first paint. Same storage key as the app's ThemeProvider.
      try {
        var saved = localStorage.getItem('vite-ui-theme')
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
        if (localStorage.getItem('pi2go-tabler-sidebar') === 'folded') document.documentElement.setAttribute('data-bs-sidebar', 'folded-hover')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tabler/main.tsx"></script>
  </body>
</html>
